<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Link Email — HIMS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html">HIMS</a><h1>Link your email</h1><p>One-time migration for an account created before email sign-in. Confirm its old phone number and current password, then add an email.</p>
  <form id="link-email-form"><label for="link-phone">Existing account phone number</label><input id="link-phone" class="form-input" type="tel" autocomplete="tel" placeholder="+14155550123" required><small>Include your country code.</small><label for="link-password">Current password</label><input id="link-password" class="form-input" type="password" autocomplete="current-password" required><label for="link-email">Email address</label><input id="link-email" class="form-input" type="email" autocomplete="email" required><label class="auth-consent"><input id="link-email-opt-in" type="checkbox" required> I agree to receive appointment confirmations and updates by email.</label><p id="link-email-error" class="auth-message" role="alert"></p><button class="btn btn-primary" type="submit">Link Email</button></form>
  <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
</main><script src="api.js"></script><script src="account-migration.js"></script></body></html>
