<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Account — HIMS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><main class="auth-card auth-card-wide"><a class="auth-brand" href="index.html">HIMS</a><h1>Create your account</h1><p>Choose your role. Your email is used to sign in and receive appointment updates.</p>
  <form id="signup-form"><div class="auth-grid"><div><label for="signup-name">Full name</label><input id="signup-name" class="form-input" autocomplete="name" required></div><div><label for="signup-email">Email address</label><input id="signup-email" class="form-input" type="email" autocomplete="email" required></div></div>
    <label for="signup-password">Password</label><input id="signup-password" class="form-input" type="password" minlength="10" autocomplete="new-password" required><small>Use at least 10 characters.</small>
    <label for="signup-role">Desired role</label><select id="signup-role" class="form-input"><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="admin">Administrator (invite code required)</option></select>
    <section id="patient-fields"><h2>Patient details</h2><div class="auth-grid"><div><label for="signup-age">Age</label><input id="signup-age" class="form-input" type="number" min="0" max="130"></div><div><label for="signup-gender">Gender</label><select id="signup-gender" class="form-input"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label for="signup-blood">Blood group</label><select id="signup-blood" class="form-input"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div><label for="signup-doctor">Assigned doctor</label><select id="signup-doctor" class="form-input"></select></div></div></section>
    <section id="doctor-fields" hidden><h2>Doctor details</h2><div class="auth-grid"><div><label for="signup-specialty">Specialty</label><input id="signup-specialty" class="form-input"></div><div><label for="signup-department">Department</label><input id="signup-department" class="form-input"></div></div></section>
    <section id="admin-fields" hidden><label for="admin-code">Administrator invite code</label><input id="admin-code" class="form-input" type="password" autocomplete="off"></section>
    <label class="auth-consent"><input id="email-opt-in" type="checkbox" required> I agree to receive appointment confirmations and updates by email.</label>
    <p id="signup-error" class="auth-message" role="alert"></p><button class="btn btn-primary" type="submit">Create Account</button></form>
  <p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p><p class="auth-switch"><a href="index.html">Back to home</a></p>
</main><script src="api.js"></script><script src="auth.js"></script></body></html>
