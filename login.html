<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign In — HIMS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html">HIMS</a><h1>Sign in</h1><p>Use your email address and password to continue.</p>
  <form id="login-form"><label for="login-email">Email address</label><input id="login-email" class="form-input" type="email" autocomplete="email" required><label for="login-password">Password</label><input id="login-password" class="form-input" type="password" autocomplete="current-password" required><p id="login-error" class="auth-message" role="alert"></p><button class="btn btn-primary" type="submit">Sign In</button></form>
  <p class="auth-switch">Existing account made with a phone number? <a href="link-email.html">Link your email first</a></p><p class="auth-switch">New to HIMS? <a href="signup.html">Create an account</a></p><p class="auth-switch"><a href="index.html">Back to home</a></p>
</main><script src="api.js"></script><script src="auth.js"></script></body></html>
